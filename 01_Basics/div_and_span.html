<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span Tags</title>
</head>
<body>
    <h1>Div vs Span Tag Practice</h1>

    <!-- div tag: block-level element (takes full width) -->
    <div style="background-color: lightblue; padding: 10px; margin: 10px 0;">
        <p>Hello World</p>
        <h2>Div takes full width (block element)</h2>
    </div>

    <!-- span tag: inline element (takes only needed width) -->
    <p>This is <span style="background-color: lightyellow;">an inline span</span> element.</p>
    <br/>
    <span style="background-color: lightgreen;">Span only takes the space it needs</span>
</body>
</html>
