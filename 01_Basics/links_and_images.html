<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>
<body>
    <h1>Anchor Tag and Image Tag Practice</h1>

    <!-- Simple Links -->
    <a href="https://www.youtube.com/">YouTube Link</a>
    <br/>
    <a href="https://www.instagram.com/?hl=en">Instagram Link</a>
    <br/>

    <!-- Link to another local page -->
    <a href="hello.html">Go to Hello Page</a>
    <br/>

    <!-- Image Tag -->
    <img src="https://variety.com/wp-content/uploads/2025/07/new-harry-old-harry.jpg?w=1000" alt="Harry Potter" height="100" />
    <br/>

    <!-- Image wrapped in a link (opens in new tab) -->
    <a href="https://www.youtube.com/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/YouTube_Logo_2017.svg/512px-YouTube_Logo_2017.svg.png" alt="YouTube Logo" height="50" />
    </a>
</body>
</html>
