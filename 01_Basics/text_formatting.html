<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Tags</title>
</head>
<body>
    <!-- Heading Tags (h1 to h6) -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <!-- Paragraph and Underline -->
    <p>Hi <u>my name</u> is Shaurya. I am doing B.Tech in Bennett University.</p>
    <hr/>

    <!-- Preformatted Text -->
    <pre>Hi        <u>my name</u> is Shaurya. I am doing B.Tech in Bennett University.</pre>

    <!-- Line Break -->
    my name is Shaurya Bhatia!
    <br/>

    <!-- Bold, Italic, Underline -->
    <b>SHAURYA</b>
    <br/>
    <i>SHAURYA</i>
    <br/>
    <u>SHAURYA</u>
    <br/>

    <!-- Big and Small Tags -->
    <big>This is big text!</big>
    <hr/>
    <small>This is small text!</small>
    <hr/>

    <!-- Subscript and Superscript -->
    <p>H<sub>2</sub>O</p>
    <hr/>
    <p>2<sup>n</sup>3</p>
</body>
</html>
