<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>
<body>
    <main>
        <h1>Ordered List Practice</h1>
        <!-- Ordered list with nested sub-lists -->
        <ol>
            <li>Apple</li>
            <ol>
                <li>Colour: Red</li>
                <li>Season: Winter</li>
            </ol>
            <li>Mango</li>
            <ol>
                <li>Colour: Yellow</li>
                <li>Season: Summer</li>
            </ol>
            <li>Banana</li>
            <ol>
                <li>Colour: Yellow</li>
                <li>Season: All Season</li>
            </ol>
            <li>Orange</li>
            <ol>
                <li>Colour: Orange</li>
                <li>Season: Winter</li>
            </ol>
        </ol>
    </main>
</body>
</html>
