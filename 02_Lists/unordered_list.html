<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <main>
        <h1>Unordered List Practice</h1>
        <!-- Unordered list with nested sub-lists -->
        <ul>
            <li>Apple</li>
            <ul>
                <li>Colour: Red</li>
                <li>Season: Winter</li>
            </ul>
            <li>Mango</li>
            <ul>
                <li>Colour: Yellow</li>
                <li>Season: Summer</li>
            </ul>
            <li>Banana</li>
            <ul>
                <li>Colour: Yellow</li>
                <li>Season: All Season</li>
            </ul>
            <li>Orange</li>
            <ul>
                <li>Colour: Orange</li>
                <li>Season: Winter</li>
            </ul>
        </ul>
    </main>
</body>
</html>
