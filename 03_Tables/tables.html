<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <main>
        <h1>Table Practice</h1>

        <!-- Table 1: Simple table with thead and tbody -->
        <table border="1" cellpadding="8" cellspacing="0">
            <caption>Student Data</caption>
            <thead>
                <tr>
                    <th>Your Name</th>
                    <th>University Name</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Shaurya Bhatia</td>
                    <td>Bennett University</td>
                    <td>Greater Noida</td>
                </tr>
            </tbody>
        </table>

        <br/><br/>

        <!-- Table 2: Using colspan to merge columns -->
        <table border="1" cellpadding="8" cellspacing="0">
            <caption>Student Data (Colspan Example)</caption>
            <thead>
                <tr>
                    <th colspan="3">YOUR INFORMATION</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Shaurya Bhatia</td>
                    <td>Bennett University</td>
                    <td>Greater Noida</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
