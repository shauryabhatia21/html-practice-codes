<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Practice</title>
</head>
<body>
    <main>
        <h1>Form Practice - Checkboxes</h1>

        <form>
            <p><strong>Select Your Subjects:</strong></p>

            <label for="sub-chem">
                <input type="checkbox" value="Chemistry" name="subject" id="sub-chem"> Chemistry
            </label>
            <br/>
            <label for="sub-eng">
                <input type="checkbox" value="English" name="subject" id="sub-eng"> English
            </label>
            <br/>
            <label for="sub-phy">
                <input type="checkbox" value="Physics" name="subject" id="sub-phy"> Physics
            </label>
            <br/>
            <label for="sub-math">
                <input type="checkbox" value="Maths" name="subject" id="sub-math"> Maths
            </label>
            <br/><br/>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
