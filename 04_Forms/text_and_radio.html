<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Text and Radio Inputs</title>
</head>
<body>
    <main>
        <h1>Form Practice - Text Input & Radio Buttons</h1>

        <form>
            <!-- Text Input -->
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter Your Username">
            <br/><br/>

            <!-- Password Input -->
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter Your Password">
            <br/><br/>

            <!-- Radio Buttons -->
            <p><strong>Select Your Class:</strong></p>
            <label for="101">
                <input type="radio" value="Class XI" name="class" id="101"> Class XI
            </label>
            <br/>
            <label for="102">
                <input type="radio" value="Class XII" name="class" id="102"> Class XII
            </label>
            <br/><br/>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
